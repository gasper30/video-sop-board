<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShortsBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF;--bg2:#ECEAE3;--bg3:#FFFFFF;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1A1A1A;--text2:#555;--text3:#999;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --orange:#D85A30;--orange-bg:#FAECE7;
  --green:#0F6E56;--green-bg:#E1F5EE;
  --amber:#BA7517;--amber-bg:#FAEEDA;
  --pink:#993556;--pink-bg:#FBEAF0;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --r:14px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--bg3);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.header-logo{width:36px;height:36px;background:var(--purple);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;color:var(--text3)}
.header-info{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat-icon{font-size:18px;margin-bottom:4px}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:10px;color:var(--text3);margin-top:3px}
.s-total .stat-num{color:var(--purple)}
.s-active .stat-num{color:var(--orange)}
.s-review .stat-num{color:var(--amber)}
.s-done .stat-num{color:var(--green)}
.filters{display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.filter-count{background:rgba(255,255,255,0.3);border-radius:10px;padding:1px 6px;font-size:10px}
.filter-btn:not(.active) .filter-count{background:var(--bg2);color:var(--text3)}
.project-list{padding:0 18px 100px}
.project-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:all .15s;position:relative}
.project-card:hover{border-color:var(--border2);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.project-card.urgent{border-left:3px solid var(--orange)}
.pc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pc-title{font-size:14px;font-weight:700;flex:1;line-height:1.4;cursor:pointer}
.pc-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pc-arrow{color:var(--text3);font-size:16px;margin-top:1px;cursor:pointer}
.pc-delete{background:var(--orange-bg);border:none;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.pc-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;cursor:pointer}
.pc-stage{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px}
.pc-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.pc-bar{display:flex;gap:3px;align-items:center;cursor:pointer}
.pb-seg{height:5px;border-radius:3px;flex:1;background:var(--bg2)}
.pc-count{font-size:11px;color:var(--text3);margin-left:4px;flex-shrink:0}
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;background:var(--purple);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;color:#fff;box-shadow:0 4px 16px rgba(83,74,183,0.4);z-index:9;transition:transform .15s}
.fab:active{transform:scale(0.93)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:20}
.overlay.on{display:block}
.panel{position:fixed;inset:0;background:var(--bg);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.panel.on{transform:translateX(0)}
.panel-header{background:var(--bg3);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;z-index:5}
.panel-back{background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2);flex-shrink:0;margin-top:2px}
.panel-info{flex:1}
.panel-title{font-size:15px;font-weight:700;line-height:1.4}
.panel-stage{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;margin-top:4px}
.panel-body{padding:14px 18px 80px}
.section-title{font-size:13px;font-weight:700;color:var(--text);margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}
.node-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.node-card.node-active{border-color:var(--purple)}
.node-card.node-done{opacity:.72}
.node-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.node-header:active{background:var(--bg)}
.node-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.node-name{font-size:13px;font-weight:600;flex:1}
.node-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:10px}
.nb-done{background:var(--green-bg);color:var(--green)}
.nb-active{background:var(--purple-bg);color:var(--purple)}
.nb-wait{background:var(--bg2);color:var(--text3)}
.nb-review{background:var(--amber-bg);color:var(--amber)}
.node-chevron{font-size:14px;color:var(--text3);transition:transform .2s;margin-left:2px}
.node-chevron.open{transform:rotate(90deg)}
.node-body{display:none;border-top:1px solid var(--border);background:var(--bg);padding:12px 14px}
.node-body.open{display:block}
.ns-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase}
.content-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;font-size:12px;color:var(--text2);line-height:1.8;white-space:pre-wrap;margin-bottom:12px}
.progress-detail{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:12px}
.progress-bar-full{height:8px;background:var(--bg2);border-radius:4px;margin-bottom:8px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-pct{font-size:13px;font-weight:700;color:var(--text)}
.progress-sub{font-size:11px;color:var(--text3)}
.checklist{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;background:var(--bg3);border:1px solid var(--border)}
.check-item:active{background:var(--bg2)}
.check-item.checked .ci-text{text-decoration:line-through;color:var(--text3)}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.check-box.on{background:var(--green);border-color:var(--green);color:#fff}
.ci-text{font-size:12px;color:var(--text2);line-height:1.5}
.upload-area{border:1.5px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;cursor:pointer}
.upload-area:hover{background:var(--bg2)}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-label{font-size:12px;color:var(--text3)}
.comments{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.comment{border-radius:var(--r-sm);padding:9px 11px}
.user-c{background:var(--bg3);border:1px solid var(--border)}
.ai-c{background:var(--purple-bg);border-left:2px solid var(--purple)}
.c-author{font-size:11px;font-weight:700;margin-bottom:3px}
.user-c .c-author{color:var(--text2)}
.ai-c .c-author{color:var(--purple)}
.c-text{font-size:12px;color:var(--text2);line-height:1.6}
.c-time{font-size:10px;color:var(--text3);margin-top:3px}
.comment-row{display:flex;gap:8px;margin-top:8px}
.comment-row input{flex:1;font-size:13px;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg3);color:var(--text);font-family:inherit;outline:none}
.comment-row input:focus{border-color:var(--purple)}
.send-btn{background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.copy-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.copy-toast.show{opacity:1}
.loading-screen{position:fixed;inset:0;background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px}
.loading-logo{width:56px;height:56px;background:var(--purple);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.loading-title{font-size:18px;font-weight:700;color:var(--text)}
.loading-sub{font-size:13px;color:var(--text3)}
.loading-spinner{width:24px;height:24px;border:2px solid var(--purple-bg);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4)}
.modal-box{position:relative;background:var(--bg3);border-radius:20px 20px 0 0;padding:20px 18px 40px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:14px}
.form-input:focus{border-color:var(--purple)}
.form-textarea{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:14px;resize:none;min-height:80px;line-height:1.6}
.form-textarea:focus{border-color:var(--purple)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-opt{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;background:var(--bg3);transition:all .15s}
.chip-opt.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.create-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.create-btn:disabled{opacity:.5;cursor:not-allowed}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--text2)}
.generating-bar{background:var(--purple-bg);border:1px solid rgba(83,74,183,0.2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--purple);display:none;align-items:center;gap:8px}
.generating-bar.on{display:flex}
.gen-spinner{width:14px;height:14px;border:2px solid rgba(83,74,183,0.2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px}
.onboard-screen{position:fixed;inset:0;background:var(--bg3);z-index:60;display:none;flex-direction:column;overflow-y:auto}
.onboard-screen.on{display:flex}
.onboard-inner{padding:40px 24px 60px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:0}
.onboard-steps{display:flex;gap:6px;margin-bottom:32px}
.onboard-step{height:4px;border-radius:2px;flex:1;background:var(--bg2);transition:background .3s}
.onboard-step.on{background:var(--purple)}
.onboard-title{font-size:26px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.2}
.onboard-sub{font-size:14px;color:var(--text3);margin-bottom:32px;line-height:1.6}
.ob-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;display:block}
.ob-input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:20px}
.ob-input:focus{border-color:var(--purple)}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ob-chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border2);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;background:var(--bg3);transition:all .15s}
.ob-chip.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.ob-textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:20px;resize:none;min-height:80px;line-height:1.6}
.ob-textarea:focus{border-color:var(--purple)}
.ob-next{width:100%;padding:15px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.ob-skip{width:100%;padding:12px;background:transparent;color:var(--text3);border:none;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px}
.ob-saving{text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ob-saving-spinner{width:32px;height:32px;border:3px solid var(--purple-bg);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
.persona-btn{background:var(--purple-bg);border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--purple);cursor:pointer;font-family:inherit}
/* 確認刪除 modal */
.confirm-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.confirm-modal.on{display:flex}
.confirm-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.confirm-box{position:relative;background:var(--bg3);border-radius:var(--r);padding:24px;width:100%;max-width:320px;text-align:center}
.confirm-icon{font-size:36px;margin-bottom:12px}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:6px}
.confirm-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-cancel{flex:1;padding:12px;background:var(--bg2);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit}
.confirm-ok{flex:1;padding:12px;background:var(--orange);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}

/* ===== 腳本分鏡卡片 ===== */
.script-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.copy-all-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.raw-toggle{padding:8px 12px;background:var(--bg2);color:var(--text2);border:none;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.raw-toggle.on{background:var(--purple-bg);color:var(--purple)}

/* 時間軸 */
.script-timeline{display:flex;align-items:center;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.script-timeline::-webkit-scrollbar{display:none}
.tl-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0;cursor:pointer}
.tl-dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px currentColor;flex-shrink:0;transition:transform .15s}
.tl-node:hover .tl-dot{transform:scale(1.3)}
.tl-label{font-size:9px;font-weight:700;margin-top:4px;white-space:nowrap;color:var(--text3)}
.tl-time{font-size:8px;color:var(--text3);margin-top:1px;white-space:nowrap}
.tl-line{flex:1;height:2px;background:var(--border2);min-width:16px;flex-shrink:0;margin-bottom:20px}

/* 分鏡卡片 */
.scene-cards-wrap{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.scard-header{display:flex;align-items:center;gap:10px;padding:10px 14px}
.scard-num{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.scard-title{font-size:13px;font-weight:700;flex:1}
.scard-time{font-size:10px;color:var(--text3);flex-shrink:0}
.scard-opt-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:2px 4px;border-radius:6px;transition:background .15s;flex-shrink:0}
.scard-opt-btn:hover{background:var(--bg2)}
.scard-body{border-top:1px solid var(--border);padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.scard-row{display:flex;flex-direction:column;gap:4px}
.scard-row-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.04em}
.scard-row-text{font-size:12px;color:var(--text2);line-height:1.7}

/* 優化選單 bottom sheet */
.opt-sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center}
.opt-sheet.on{display:flex}
.opt-sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4)}
.opt-sheet-box{position:relative;background:var(--bg3);border-radius:20px 20px 0 0;padding:20px 18px 40px;width:100%;max-width:480px}
.opt-sheet-title{font-size:14px;font-weight:700;margin-bottom:4px}
.opt-sheet-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--bg);transition:all .15s}
.opt-item:active{background:var(--bg2)}
.opt-item-icon{font-size:20px;flex-shrink:0}
.opt-item-text{font-size:13px;font-weight:500;color:var(--text)}
.opt-item-hint{font-size:11px;color:var(--text3);margin-top:2px}

/* 場景卡（拍攝用） */
.scene-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.scene-card.scene-done{opacity:.65}
.scene-card.scene-done .scene-card-header{background:var(--green-bg)}
.scene-card-header{background:var(--orange-bg);padding:10px 14px;display:flex;align-items:center;gap:10px}
.scene-num{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.scene-card.scene-done .scene-num{background:var(--green)}
.scene-title-tx{font-size:13px;font-weight:700;flex:1;color:var(--text)}
.scene-time-tx{font-size:11px;color:var(--text3);flex-shrink:0}
.scene-done-badge{font-size:10px;background:var(--green);color:#fff;padding:2px 8px;border-radius:10px;font-weight:500}
.scene-body{padding:12px 14px}

// ===== 腳本解析 =====
var SEG_COLORS = ['#534AB7','#D85A30','#0F6E56','#BA7517','#993556','#185FA5'];

function parseScript(rawText) {
  if (!rawText || rawText === 'AI 正在產出腳本，請稍候...') return null;
  var segments = [];
  // 切段：以【開頭
  var parts = rawText.split(/(?=【)/);
  parts.forEach(function(part, i) {
    part = part.trim();
    if (!part) return;
    var headerMatch = part.match(/【([^】]+)】/);
    if (!headerMatch) return;
    var header = headerMatch[1];
    // 從標題抓時間（例：0–3秒、3–20秒）
    var timeMatch = header.match(/([\d０-９]+[–\-~～到至][\d０-９]+\s*秒|最後\s*[\d０-９]+\s*秒|前\s*[\d０-９]+\s*秒)/);
    var timeRange = timeMatch ? timeMatch[0] : '';
    // 清理標題
    var cleanTitle = header.replace(/\s*([\d０-９]+[–\-~～到至][\d０-９]+\s*秒|最後\s*[\d０-９]+\s*秒|前\s*[\d０-９]+\s*秒)\s*/g,'').trim();
    if (!cleanTitle) cleanTitle = '段落 '+(i+1);
    // 抓畫面和口播
    var body = part.replace(/【[^】]+】/,'').trim();
    var visualMatch = body.match(/(?:畫面|鏡頭)[：:]\s*([^\n口播]+)/);
    var scriptMatch = body.match(/(?:口播|文案|台詞)[：:]\s*([^\n畫面鏡頭]+)/);
    var visual = visualMatch ? visualMatch[1].trim() : '';
    var script = scriptMatch ? scriptMatch[1].trim() : body.replace(/(?:畫面|鏡頭)[：:].*\n?/,'').replace(/(?:口播|文案|台詞)[：:]/,'').trim();
    if (!visual && !script) { script = body; }
    segments.push({
      index: i+1,
      title: cleanTitle,
      timeRange: timeRange,
      visual: visual,
      script: script,
      color: SEG_COLORS[i % SEG_COLORS.length]
    });
  });
  return segments.length ? segments : null;
}

function openOptSheet(segIdx, segments) {
  currentOptSeg = segments[segIdx];
  var isHookSeg = currentOptSeg.title.toLowerCase().indexOf('hook') > -1 || segIdx === 0;
  document.getElementById('opt-sheet-sub').textContent = '「' + currentOptSeg.title + '」段落';
  var list = document.getElementById('opt-list');
  list.innerHTML = OPT_ACTIONS
    .filter(function(a){ return !a.isHook || isHookSeg; })
    .map(function(a, i) {
      return '<div class="opt-item" onclick="copyOpt('+i+','+segIdx+','+JSON.stringify(segments).split('"').join('&quot;')+'_SKIP)">'
        + '<div class="opt-item-icon">'+a.icon+'</div>'
        + '<div><div class="opt-item-text">'+a.text+'</div><div class="opt-item-hint">'+a.hint+'</div></div>'
        + '</div>';
    }).join('');
  // rebuild with proper data reference
  list.innerHTML = OPT_ACTIONS
    .filter(function(a){ return !a.isHook || isHookSeg; })
    .map(function(a, i) {
      return '<div class="opt-item" id="optitem-'+i+'">'
        + '<div class="opt-item-icon">'+a.icon+'</div>'
        + '<div><div class="opt-item-text">'+a.text+'</div><div class="opt-item-hint">'+a.hint+'</div></div>'
        + '</div>';
    }).join('');
  // bind click with closure
  var filteredActions = OPT_ACTIONS.filter(function(a){ return !a.isHook || isHookSeg; });
  filteredActions.forEach(function(a, i) {
    var el = document.getElementById('optitem-'+i);
    if (el) el.onclick = function() {
      var text = a.prompt(currentOptSeg);
      copyText(text, '✅ 已複製！貼給 Claude 優化這段');
      closeOptSheet();
    };
  });
  document.getElementById('opt-sheet').classList.add('on');
}
function closeOptSheet() {
  document.getElementById('opt-sheet').classList.remove('on');
  currentOptSeg = null;
}

function copyText(text, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){ showToast(msg); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast(msg);
  }
}

// ===== 腳本節點渲染 =====
function renderScriptNode(p) {
  var n = p.nodes.script;
  var content = n.content || '';
  var isGenerating = content === 'AI 正在產出腳本，請稍候...';
  var segments = isGenerating ? null : parseScript(content);

  var html = '';

  if (isGenerating) {
    html += '<div style="text-align:center;padding:24px;color:var(--purple)"><div class="gen-spinner" style="margin:0 auto 10px"></div><div style="font-size:13px;font-weight:600">AI 正在產出腳本，請稍候...</div></div>';
  } else if (segments) {
    // 頂部工具列
    html += '<div class="script-toolbar">';
    html += '<button class="copy-all-btn" onclick="copyAllScript(\''+encodeURIComponent(content)+'\')">📋 複製完整腳本</button>';
    html += '<button class="raw-toggle'+(rawScriptMode?' on':'')+'" onclick="toggleRawScript()">原始文字</button>';
    html += '</div>';

    if (rawScriptMode) {
      html += '<div class="content-box">'+content+'</div>';
    } else {
      // 時間軸
      html += '<div class="script-timeline">';
      segments.forEach(function(seg, i) {
        if (i > 0) html += '<div class="tl-line"></div>';
        html += '<div class="tl-node"><div class="tl-dot" style="color:'+seg.color+';background:'+seg.color+'"></div><div class="tl-label" style="color:'+seg.color+'">'+seg.title+'</div>'+(seg.timeRange?'<div class="tl-time">'+seg.timeRange+'</div>':'')+'</div>';
      });
      html += '</div>';

      // 分鏡卡片
      html += '<div class="scene-cards-wrap" id="scards-'+p.id+'">';
      segments.forEach(function(seg, i) {
        html += '<div class="scard">';
        html += '<div class="scard-header" style="background:'+seg.color+'18;border-bottom:1px solid '+seg.color+'30">';
        html += '<div class="scard-num" style="background:'+seg.color+'">'+seg.index+'</div>';
        html += '<div class="scard-title" style="color:'+seg.color+'">'+seg.title+'</div>';
        if (seg.timeRange) html += '<div class="scard-time">'+seg.timeRange+'</div>';
        html += '<button class="scard-opt-btn" id="optbtn-'+p.id+'-'+i+'" title="優化這段">✨</button>';
        html += '</div>';
        html += '<div class="scard-body">';
        if (seg.visual) {
          html += '<div class="scard-row"><div class="scard-row-label">🎥 畫面說明</div><div class="scard-row-text">'+seg.visual+'</div></div>';
        }
        if (seg.script) {
          html += '<div class="scard-row"><div class="scard-row-label">🎙 口播腳本</div><div class="scard-row-text">'+seg.script+'</div></div>';
        }
        html += '</div></div>';
      });
      html += '</div>';

      // 綁定✨按鈕（用 setTimeout 確保 DOM ready）
      setTimeout(function() {
        segments.forEach(function(seg, i) {
          var btn = document.getElementById('optbtn-'+p.id+'-'+i);
          if (btn) btn.onclick = function(e) {
            e.stopPropagation();
            openOptSheet(i, segments);
          };
        });
      }, 50);
    }
  } else {
    // 無法解析，fallback 純文字
    html += '<div class="script-toolbar"><button class="copy-all-btn" onclick="copyAllScript(\''+encodeURIComponent(content)+'\')">📋 複製完整腳本</button></div>';
    html += '<div class="content-box">'+content+'</div>';
  }

  // 留言區
  var commentsHtml = '';
  if (n.comments && n.comments.length) {
    commentsHtml = n.comments.map(function(c){ return '<div class="comment '+(c.ai?'ai-c':'user-c')+'"><div class="c-author">'+c.author+'</div><div class="c-text">'+c.text+'</div><div class="c-time">'+c.time+'</div></div>'; }).join('');
  } else {
    commentsHtml = '<div style="font-size:11px;color:var(--text3);padding:4px 0 8px">尚無留言</div>';
  }
  html += '<div class="ns-label" style="margin-top:14px">留言與修改建議</div><div class="comments">'+commentsHtml+'</div>';
  html += '<div class="comment-row"><input id="ci-script" placeholder="輸入修改建議..." /><button class="send-btn" onclick="sendComment(\''+p.id+'\',\'script\',\'script\')">送出</button></div>';

  return html;
}

function copyAllScript(encoded) {
  var text = decodeURIComponent(encoded);
  copyText(text, '📋 完整腳本已複製！');
}

function toggleRawScript() {
  rawScriptMode = !rawScriptMode;
  if (openProject) {
    var p = projects.filter(function(x){ return x.id === openProject; })[0];
    if (p) renderPanelBody(p);
  }
}

// ===== 拍攝場景卡 =====
function renderSceneCards(p, ph) {
  var n = p.nodes[ph.key];
  if (!n.scenes || !n.scenes.length) return '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">腳本產出後將自動生成分鏡卡片</div>';
  var doneCnt = n.scenes.filter(function(s){return s.done;}).length;
  var total = n.scenes.length;
  var pct = total>0?Math.round(doneCnt/total*100):0;
  var html = '<div class="ns-label">拍攝進度</div>';
  html += '<div class="progress-detail"><div class="progress-bar-full"><div class="progress-bar-fill" style="width:'+pct+'%;background:'+ph.color+'"></div></div><div class="progress-pct">'+pct+'%</div><div class="progress-sub">'+doneCnt+' / '+total+' 個分鏡完成</div></div>';
  html += '<div class="ns-label">分鏡卡片</div>';
  n.scenes.forEach(function(sc,si) {
    html += '<div class="scene-card'+(sc.done?' scene-done':'')+'">';
    html += '<div class="scene-card-header"><div class="scene-num">'+(si+1)+'</div><div class="scene-title-tx">'+sc.title+'</div><div class="scene-time-tx">'+sc.time+'</div>'+(sc.done?'<span class="scene-done-badge">✓ 完成</span>':'')+'</div>';
    html += '<div class="scene-body"><div class="scene-row"><div class="scene-info"><div class="scene-info-label">🎥 畫面說明</div><div class="scene-info-text">'+sc.shot+'</div></div><div class="scene-divider"></div><div class="scene-info"><div class="scene-info-label">🎙 口播腳本</div><div class="scene-info-text">'+sc.script+'</div></div></div>';
    html += '<button class="scene-check-btn'+(sc.done?' done':'')+'" onclick="toggleScene(\''+p.id+'\',\''+ph.key+'\','+si+')"><div class="scene-check-icon">'+(sc.done?'✓':'')+'</div>'+(sc.done?'已拍攝完成':'標記為已拍攝')+'</button>';
    html += '<div class="scene-notes"><div class="scene-notes-label">📝 拍攝備註</div><textarea class="scene-notes-box" placeholder="例如：光線不足，需補拍..." onchange="updateNote(\''+p.id+'\',\''+ph.key+'\','+si+',this.value)">'+sc.note+'</textarea></div>';
    html += '</div></div>';
  });
  return html;
}

var projects = [];
var openProject = null;
var openNode = null;
var currentFilter = 'all';
var pollTimer = null;
var pendingDeleteId = null;

      {done:false,text:'第一幀疊加大字 Hook'},{done:false,text:'完整審視確認'},
      {done:false,text:'匯出 1080p MP4'}
    ],comments:[]},

function selectChip(groupId, btn) {
  var group = document.getElementById(groupId);
  group.querySelectorAll('.chip-opt').forEach(function(c){ c.classList.remove('on'); });
  btn.classList.add('on');
}
function getSelectedChip(groupId) {
  var group = document.getElementById(groupId);
  if (!group) return '';
  var sel = group.querySelector('.chip-opt.on');
  return sel ? sel.textContent : '';
}

async function createProject() {
  var title = document.getElementById('new-title').value.trim();
  var points = document.getElementById('new-points').value.trim();
  if (!title) { alert('請輸入影片主題'); return; }
  if (!points) { alert('請填寫核心重點'); return; }
  var uid = getUserId();
  if (!uid) { alert('請先完成人設設定'); return; }
  var btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = '送出中...';
  document.getElementById('gen-bar').classList.add('on');
  var projId = 'p' + Date.now();
  var tempProj = { id:projId, user_id:uid, col:'script', title:title, tags:[], urgent:false, nodes:makeDefaultNodes() };
  var saved = null;
  if (!uid.startsWith('anon_')) { saved = await dbInsert(tempProj); }
  if (saved || uid.startsWith('anon_')) {
    projects.unshift(saved || tempProj);
    renderFilters(); renderList();
  }
  try {
    await fetch(WEBHOOK_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ user_id:uid, project_id:projId, title:title, points:points.replace(/\n/g,' ').replace(/\r/g,' '), length:getSelectedChip('length-chips'), material:getSelectedChip('material-chips'), style:getSelectedChip('style-chips') })
    });
  } catch(e) { console.error('Webhook error', e); }
  closeModal();
  if (!uid.startsWith('anon_')) { startPolling(projId); }
}

function startPolling(projId) {
  var attempts = 0;
  pollTimer = setInterval(async function() {
    attempts++;
    if (attempts > 24) { clearInterval(pollTimer); return; }
    var res = await sbFetch('/projects?id=eq.' + projId);
    if (!res.ok) return;
    var data = await res.json();
    if (!data.length) return;
    var updated = data[0];
    if (updated.nodes && updated.nodes.script && updated.nodes.script.content && updated.nodes.script.content !== 'AI 正在產出腳本，請稍候...') {
      clearInterval(pollTimer);
      var idx = projects.findIndex(function(p){ return p.id === projId; });
      if (idx > -1) projects[idx] = updated;
      renderFilters(); renderList();
      if (openProject === projId) {
        renderPanelBody(updated);
      }
      showToast('✅ 腳本產出完成！');
    }
  }, 5000);
}

function getNodeDots(proj) {
  var order = ['script','shoot','edit','cover','copy','publish'];
  var colors = ['#534AB7','#D85A30','#0F6E56','#BA7517','#993556','#185FA5'];
  return order.map(function(key,i) {
    var n = proj.nodes[key];
    if (!n) return '#E0E0E0';
    if (n.status==='done') return '#0F6E56';
    if (n.status==='active'||n.status==='review') return colors[i];
    return '#E0E0E0';
  });
}
function getDoneCount(proj) {
  return ['script','shoot','edit','cover','copy','publish'].filter(function(k){ return proj.nodes[k]&&proj.nodes[k].status==='done'; }).length;
}
function getStatusBadge(status) {
  var m = {done:{cls:'nb-done',label:'已完成'},active:{cls:'nb-active',label:'進行中'},wait:{cls:'nb-wait',label:'待開始'},review:{cls:'nb-review',label:'待審核'}};
  return m[status]||m['wait'];
}

function renderFilters() {
  var stages = ['all','script','shoot','edit','review','schedule','done'];
  var labels = {all:'全部',script:'腳本',shoot:'拍攝',edit:'後製',review:'待審核',schedule:'排程',done:'已發布'};
  document.getElementById('filters').innerHTML = stages.map(function(s) {
    var cnt = s==='all'?projects.length:projects.filter(function(p){return p.col===s;}).length;
    if (cnt===0&&s!=='all') return '';
    return '<button class="filter-btn'+(currentFilter===s?' active':'')+'" onclick="setFilter(\''+s+'\')">'
      +labels[s]+'<span class="filter-count">'+cnt+'</span></button>';
  }).join('');
}
function setFilter(f) { currentFilter=f; renderFilters(); renderList(); }

function renderList() {
  var list = document.getElementById('project-list');
  var filtered = currentFilter==='all'?projects:projects.filter(function(p){return p.col===currentFilter;});
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">'+(currentFilter==='all'?'還沒有影片專案':'此分類沒有影片')+'</div><div class="empty-sub">'+(currentFilter==='all'?'點右下角 ＋ 新增第一支影片！':'換個分類看看')+'</div></div>';
    updateStats(); return;
  }
  list.innerHTML = filtered.map(function(p) {
    var dots = getNodeDots(p); var done = getDoneCount(p);
    var sc = STAGE_COLORS[p.col]||STAGE_COLORS['script'];
    var tagsHtml = (p.tags||[]).map(function(t){ var tg=TAGS[t]||{label:t,bg:'#F1EFE8',color:'#444441'}; return '<span class="pc-tag" style="background:'+tg.bg+';color:'+tg.color+'">'+tg.label+'</span>'; }).join('');
    var dotsHtml = dots.map(function(d){ return '<div class="pb-seg" style="background:'+d+'"></div>'; }).join('');
    return '<div class="project-card'+(p.urgent?' urgent':'')+'">'
      +'<div class="pc-top"><div class="pc-title" onclick="openPanel(\''+p.id+'\')">'+(p.urgent?'⚠️ ':'')+p.title+'</div>'
      +'<div class="pc-actions"><button class="pc-delete" onclick="askDelete(\''+p.id+'\',\''+p.title.replace(/'/g,"\\'")+'\')" title="刪除">🗑</button><div class="pc-arrow" onclick="openPanel(\''+p.id+'\')">›</div></div></div>'
      +'<div class="pc-meta" onclick="openPanel(\''+p.id+'\')"><span class="pc-stage" style="background:'+sc.bg+';color:'+sc.color+'">'+sc.label+'</span>'+tagsHtml+'</div>'
      +'<div class="pc-bar" onclick="openPanel(\''+p.id+'\')">'+dotsHtml+'<span class="pc-count">'+done+'/6</span></div></div>';
  }).join('');
  updateStats();
}
function updateStats() {
  document.getElementById('s-total').textContent = projects.length;
  document.getElementById('s-active').textContent = projects.filter(function(p){return p.col!=='pending'&&p.col!=='done';}).length;
  document.getElementById('s-review').textContent = projects.filter(function(p){return p.col==='review';}).length;
  document.getElementById('s-done').textContent = projects.filter(function(p){return p.col==='done';}).length;
}

function askDelete(id, title) {
  pendingDeleteId = id;
  document.getElementById('confirm-sub').textContent = '「'+title+'」刪除後無法復原。';
  document.getElementById('confirm-modal').classList.add('on');
}
function closeConfirm() {
  pendingDeleteId = null;
  document.getElementById('confirm-modal').classList.remove('on');
}
async function confirmDelete() {
  if (!pendingDeleteId) return;
  var id = pendingDeleteId;
  closeConfirm();
  await dbDelete(id);
  projects = projects.filter(function(x){ return x.id !== id; });
  renderFilters(); renderList();
  showToast('🗑 已刪除');
}

function openPanel(id) {
  openProject=id; openNode=null; rawScriptMode=false;
  var p = projects.filter(function(x){return x.id===id;})[0];
  var sc = STAGE_COLORS[p.col]||STAGE_COLORS['script'];
  document.getElementById('p-title').textContent = p.title;
  var stageEl = document.getElementById('p-stage');
  stageEl.textContent = sc.label; stageEl.style.background = sc.bg; stageEl.style.color = sc.color;
  renderPanelBody(p);
  document.getElementById('panel').classList.add('on');
  document.getElementById('overlay').classList.add('on');
}

function renderPanelBody(p) {
  var html = '<div class="section-title">🗂 製作流程</div>';
  PHASES.forEach(function(ph,i) {
    var n = p.nodes[ph.key];
    var isOpen = openNode===i;
    var sb = getStatusBadge(n.status);
    var isCurrent = n.status==='active'||n.status==='review';
    var bodyHtml = '';

    if (ph.key === 'script') {
      bodyHtml = renderScriptNode(p);
    } else if (ph.key === 'shoot') {
      bodyHtml = renderSceneCards(p, ph);
      // 留言
      var sc2 = n.comments&&n.comments.length ? n.comments.map(function(c){ return '<div class="comment '+(c.ai?'ai-c':'user-c')+'"><div class="c-author">'+c.author+'</div><div class="c-text">'+c.text+'</div><div class="c-time">'+c.time+'</div></div>'; }).join('') : '<div style="font-size:11px;color:var(--text3);padding:4px 0 8px">尚無留言</div>';
      bodyHtml += '<div class="ns-label" style="margin-top:14px">留言</div><div class="comments">'+sc2+'</div><div class="comment-row"><input id="ci-'+i+'" placeholder="輸入修改建議..." /><button class="send-btn" onclick="sendComment(\''+p.id+'\',\''+ph.key+'\','+i+')">送出</button></div>';
    } else {
      if (n.checks) {
        var dc=n.checks.filter(function(c){return c.done;}).length;
        var tot=n.checks.length;
        var pct=tot>0?Math.round(dc/tot*100):0;
        bodyHtml += '<div class="ns-label">執行進度</div><div class="progress-detail"><div class="progress-bar-full"><div class="progress-bar-fill" style="width:'+pct+'%;background:'+ph.color+'"></div></div><div class="progress-pct">'+pct+'%</div><div class="progress-sub">'+dc+' / '+tot+' 項完成</div></div>';
        bodyHtml += '<div class="ns-label">執行清單</div><div class="checklist">';
        n.checks.forEach(function(c,ci) {
          bodyHtml += '<div class="check-item'+(c.done?' checked':'')+'" onclick="toggleCheck(\''+p.id+'\',\''+ph.key+'\','+ci+')"><div class="check-box'+(c.done?' on':'')+'>'+(c.done?'✓':'')+'</div><span class="ci-text">'+c.text+'</span></div>';
        });
        bodyHtml += '</div>';
      }
      if (ph.key==='cover'||ph.key==='edit') {
        bodyHtml += '<div class="ns-label">'+(ph.key==='cover'?'封面上傳':'影片上傳')+'</div><div class="upload-area"><div class="upload-icon">📁</div><div class="upload-label">點此上傳檔案</div></div>';
      }
      if (n.content) {
        bodyHtml += '<div class="ns-label">產出內容</div><div class="content-box">'+n.content+'</div>';
      }
      var cmts = n.comments&&n.comments.length ? n.comments.map(function(c){ return '<div class="comment '+(c.ai?'ai-c':'user-c')+'"><div class="c-author">'+c.author+'</div><div class="c-text">'+c.text+'</div><div class="c-time">'+c.time+'</div></div>'; }).join('') : '<div style="font-size:11px;color:var(--text3);padding:4px 0 8px">尚無留言</div>';
      bodyHtml += '<div class="ns-label" style="margin-top:14px">留言</div><div class="comments">'+cmts+'</div><div class="comment-row"><input id="ci-'+i+'" placeholder="輸入修改建議..." /><button class="send-btn" onclick="sendComment(\''+p.id+'\',\''+ph.key+'\','+i+')">送出</button></div>';
    }

    html += '<div class="node-card'+(isCurrent?' node-active':'')+(n.status==='done'?' node-done':'')+'" id="node-'+i+'">';
    html += '<div class="node-header" onclick="toggleNode('+i+')">';
    html += '<div class="node-dot" style="background:'+ph.color+'"></div>';
    html += '<div class="node-name">'+ph.icon+' '+ph.label+'</div>';
    html += '<span class="node-badge '+sb.cls+'">'+sb.label+'</span>';
    html += '<span class="node-chevron'+(isOpen?' open':'')+'">›</span></div>';
    html += '<div class="node-body'+(isOpen?' open':'')+'">'+bodyHtml+'</div></div>';
  });
  document.getElementById('p-body').innerHTML = html;
}

function toggleNode(i) {
  openNode=(openNode===i)?null:i;
  var p=projects.filter(function(x){return x.id===openProject;})[0];
  renderPanelBody(p);
  if (openNode!==null) { setTimeout(function(){ var el=document.getElementById('node-'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },100); }
}
async function toggleScene(pid,phKey,si) {
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].scenes[si].done=!p.nodes[phKey].scenes[si].done;
  var allDone=p.nodes[phKey].scenes.every(function(s){return s.done;});
  if (allDone) p.nodes[phKey].status='done';
  else if (p.nodes[phKey].scenes.some(function(s){return s.done;})) p.nodes[phKey].status='active';
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelBody(p); renderList();
}
function updateNote(pid,phKey,si,val) {
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].scenes[si].note=val;
  dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
}
async function toggleCheck(pid,phKey,ci) {
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].checks[ci].done=!p.nodes[phKey].checks[ci].done;
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelBody(p); renderList();
}
async function sendComment(pid,phKey,nodeIdx) {
  var inputId = phKey==='script' ? 'ci-script' : 'ci-'+nodeIdx;
  var input=document.getElementById(inputId);
  var text=input.value.trim();
  if (!text) return;
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].comments.push({author:'你',text:text,time:'剛剛',ai:false});
  input.value='';
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelBody(p);
  setTimeout(async function(){
    p.nodes[phKey].comments.push({author:'Claude AI',text:'收到你的修改建議！請稍後查看更新內容。',time:'剛剛',ai:true});
    await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
    renderPanelBody(p);
  },800);
}

function showToast(msg) {
  var t = document.getElementById('copy-toast');
  t.textContent = msg || '✅ 已複製！';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2500);
}
function closePanel() {
  document.getElementById('panel').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
  openProject=null; openNode=null; rawScriptMode=false;
}
function openModal() {
  document.getElementById('new-title').value = '';
  document.getElementById('new-points').value = '';
  var btn = document.getElementById('create-btn');
  btn.disabled=false; btn.textContent='產出腳本 ✨';
  document.getElementById('gen-bar').classList.remove('on');
  document.getElementById('modal').classList.add('on');
}
function closeModal() { document.getElementById('modal').classList.remove('on'); }

async function init() {
  var uid = getUserId();
  if (!uid) { document.getElementById('loading').style.display='none'; showOnboarding(false); return; }
  if (!uid.startsWith('anon_')) {
    var user = await loadUser(uid);
    if (user) { currentUser = user; updateHeaderUser(); }
  } else {
    currentUser = { id:uid, name:'創作者' }; updateHeaderUser();
  }
  var data = await dbGetAll();
  projects = data;
  document.getElementById('loading').style.display='none';
  renderFilters(); renderList();
}
init();
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShortsBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF;--bg2:#ECEAE3;--bg3:#FFFFFF;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1A1A1A;--text2:#555;--text3:#999;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --orange:#D85A30;--orange-bg:#FAECE7;
  --green:#0F6E56;--green-bg:#E1F5EE;
  --amber:#BA7517;--amber-bg:#FAEEDA;
  --pink:#993556;--pink-bg:#FBEAF0;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --r:14px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ===== 主畫面 ===== */
.header{background:var(--bg3);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.header-logo{width:36px;height:36px;background:var(--purple);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;color:var(--text3)}
.header-info{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat-icon{font-size:18px;margin-bottom:4px}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:10px;color:var(--text3);margin-top:3px}
.s-total .stat-num{color:var(--purple)}
.s-active .stat-num{color:var(--orange)}
.s-review .stat-num{color:var(--amber)}
.s-done .stat-num{color:var(--green)}
.filters{display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.filter-count{background:rgba(255,255,255,0.3);border-radius:10px;padding:1px 6px;font-size:10px}
.filter-btn:not(.active) .filter-count{background:var(--bg2);color:var(--text3)}
.project-list{padding:0 18px 100px}
.project-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:all .15s;position:relative}
.project-card:hover{border-color:var(--border2);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.project-card.urgent{border-left:3px solid var(--orange)}
.pc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pc-title{font-size:14px;font-weight:700;flex:1;line-height:1.4;cursor:pointer}
.pc-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pc-arrow{color:var(--text3);font-size:16px;margin-top:1px;cursor:pointer}
.pc-delete{background:var(--orange-bg);border:none;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.pc-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;cursor:pointer}
.pc-stage{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px}
.pc-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.pc-bar{display:flex;gap:3px;align-items:center;cursor:pointer}
.pb-seg{height:5px;border-radius:3px;flex:1;background:var(--bg2)}
.pc-count{font-size:11px;color:var(--text3);margin-left:4px;flex-shrink:0}
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;background:var(--purple);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;color:#fff;box-shadow:0 4px 16px rgba(83,74,183,0.4);z-index:9;transition:transform .15s}
.fab:active{transform:scale(0.93)}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px}

/* ===== Panel ===== */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:20}
.overlay.on{display:block}
.panel{position:fixed;inset:0;background:var(--bg);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.panel.on{transform:translateX(0)}

/* Panel Header */
.panel-header{background:var(--bg3);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.panel-back{background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2);flex-shrink:0}
.panel-title{font-size:14px;font-weight:700;flex:1;line-height:1.3}
.panel-urgent{background:var(--orange-bg);color:var(--orange);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}

/* 步驟導航條 */
.step-nav{background:var(--bg3);border-bottom:1px solid var(--border);padding:12px 16px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.step-nav::-webkit-scrollbar{display:none}
.step-nav-inner{display:flex;gap:6px;min-width:max-content}
.step-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;flex-shrink:0}
.step-btn.active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
.step-btn.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.step-btn.overview{border-color:var(--border2);background:var(--bg2)}
.step-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* Panel 內容區 */
.panel-content{flex:1;overflow-y:auto;padding:16px 16px 100px}

/* 步驟說明 hint */
.step-hint{background:var(--purple-bg);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--purple);line-height:1.6}

/* ===== 腳本分鏡系統 ===== */
.script-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.copy-all-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.raw-toggle{padding:8px 12px;background:var(--bg2);color:var(--text2);border:none;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.raw-toggle.on{background:var(--purple-bg);color:var(--purple)}

/* 時間軸 */
.script-timeline{display:flex;align-items:flex-start;margin-bottom:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;gap:0}
.script-timeline::-webkit-scrollbar{display:none}
.tl-item{display:flex;align-items:flex-start;flex-shrink:0}
.tl-node{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:0 4px;min-width:48px;max-width:72px}
.tl-node:hover .tl-dot{transform:scale(1.2)}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px currentColor;flex-shrink:0;transition:transform .15s;margin-bottom:4px}
.tl-dot.active-dot{box-shadow:0 0 0 3px currentColor}
.tl-label{font-size:9px;font-weight:700;text-align:center;line-height:1.2;word-break:break-all;max-width:68px}
.tl-time{font-size:8px;color:var(--text3);text-align:center;margin-top:2px}
.tl-line{height:2px;background:var(--border2);width:16px;flex-shrink:0;margin-top:6px}

/* 分鏡卡片 */
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;scroll-margin-top:16px}
.scard.is-sub{border-left:3px solid;}
.scard-header{display:flex;align-items:center;gap:8px;padding:10px 14px}
.scard-num{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.scard-label{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;flex-shrink:0}
.scard-title{font-size:13px;font-weight:700;flex:1}
.scard-time{font-size:10px;color:var(--text3);flex-shrink:0;background:var(--bg2);padding:2px 7px;border-radius:8px}
.scard-opt{background:transparent;border:none;font-size:16px;cursor:pointer;padding:2px 4px;border-radius:6px;flex-shrink:0}
.scard-opt:hover{background:var(--bg2)}
.scard-body{padding:12px 14px;background:var(--bg);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.scard-section{display:flex;flex-direction:column;gap:6px}
.scard-section-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.04em;display:flex;align-items:center;gap:4px}
.scard-visual{font-size:12px;color:var(--text2);line-height:1.7}
.scard-visual-item{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--border)}
.scard-visual-item:last-child{border-bottom:none}
.scard-visual-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;margin-top:6px}
.scard-visual-text{font-size:12px;color:var(--text2);line-height:1.6}
.scard-script{font-size:13px;color:var(--text);line-height:1.8;font-weight:500;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px}
.scard-divider{height:1px;background:var(--border)}

/* 製作備註折疊 */
.production-notes{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:6px}
.production-notes-header{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.production-notes-title{font-size:12px;font-weight:700;color:var(--amber);flex:1}
.production-notes-chevron{font-size:12px;color:var(--text3);transition:transform .2s}
.production-notes-chevron.open{transform:rotate(90deg)}
.production-notes-body{display:none;padding:12px 14px;border-top:1px solid var(--border);background:var(--bg)}
.production-notes-body.open{display:block}
.note-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.note-row:last-child{border-bottom:none}
.note-key{color:var(--text3);flex-shrink:0;width:48px;font-weight:600}
.note-val{color:var(--text2);flex:1;line-height:1.6}

/* ===== 瀑布式全覽 ===== */
.overview-phase{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.overview-phase-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.overview-phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.overview-phase-name{font-size:13px;font-weight:600;flex:1}
.overview-phase-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:10px}
.nb-done{background:var(--green-bg);color:var(--green)}
.nb-active{background:var(--purple-bg);color:var(--purple)}
.nb-wait{background:var(--bg2);color:var(--text3)}
.overview-chevron{font-size:14px;color:var(--text3);transition:transform .2s}
.overview-chevron.open{transform:rotate(90deg)}
.overview-body{display:none;border-top:1px solid var(--border);background:var(--bg);padding:12px 14px}
.overview-body.open{display:block}

/* 通用 */
.ns-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase}
.content-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;font-size:12px;color:var(--text2);line-height:1.8;white-space:pre-wrap;margin-bottom:12px}
.progress-detail{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:12px}
.progress-bar-full{height:8px;background:var(--bg2);border-radius:4px;margin-bottom:8px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-pct{font-size:13px;font-weight:700}
.progress-sub{font-size:11px;color:var(--text3)}
.checklist{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;background:var(--bg3);border:1px solid var(--border)}
.check-item.checked .ci-text{text-decoration:line-through;color:var(--text3)}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.check-box.on{background:var(--green);border-color:var(--green);color:#fff}
.ci-text{font-size:12px;color:var(--text2);line-height:1.5}
.upload-area{border:1.5px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;cursor:pointer}
.upload-area:hover{background:var(--bg2)}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-label{font-size:12px;color:var(--text3)}
.comments{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.comment{border-radius:var(--r-sm);padding:9px 11px}
.user-c{background:var(--bg3);border:1px solid var(--border)}
.ai-c{background:var(--purple-bg);border-left:2px solid var(--purple)}
.c-author{font-size:11px;font-weight:700;margin-bottom:3px}
.user-c .c-author{color:var(--text2)}
.ai-c .c-author{color:var(--purple)}
.c-text{font-size:12px;color:var(--text2);line-height:1.6}
.c-time{font-size:10px;color:var(--text3);margin-top:3px}
.comment-row{display:flex;gap:8px;margin-top:10px}
.comment-row input{flex:1;font-size:13px;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg3);color:var(--text);font-family:inherit;outline:none}
.comment-row input:focus{border-color:var(--purple)}
.send-btn{background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.generating-box{text-align:center;padding:32px 20px;color:var(--purple)}
.generating-spinner{width:24px;height:24px;border:2px solid var(--purple-bg);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}

/* 優化選單 */
.opt-sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center}
.opt-sheet.on{display:flex}
.opt-sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4)}
.opt-sheet-box{position:relative;background:var(--bg3);border-radius:20px 20px 0 0;padding:20px 18px 40px;width:100%;max-width:480px}
.opt-sheet-title{font-size:14px;font-weight:700;margin-bottom:4px}
.opt-sheet-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--bg);transition:all .15s}
.opt-item:active{background:var(--bg2)}
.opt-item-icon{font-size:20px;flex-shrink:0}
.opt-item-text{font-size:13px;font-weight:500}
.opt-item-hint{font-size:11px;color:var(--text3);margin-top:2px}

/* 確認刪除 */
.confirm-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.confirm-modal.on{display:flex}
.confirm-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.confirm-box{position:relative;background:var(--bg3);border-radius:var(--r);padding:24px;width:100%;max-width:320px;text-align:center}
.confirm-icon{font-size:36px;margin-bottom:12px}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:6px}
.confirm-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-cancel{flex:1;padding:12px;background:var(--bg2);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit}
.confirm-ok{flex:1;padding:12px;background:var(--orange);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}

/* 新增影片 modal */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4)}
.modal-box{position:relative;background:var(--bg3);border-radius:20px 20px 0 0;padding:20px 18px 40px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:14px}
.form-input:focus{border-color:var(--purple)}
.form-textarea{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:14px;resize:none;min-height:80px;line-height:1.6}
.form-textarea:focus{border-color:var(--purple)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-opt{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;background:var(--bg3);transition:all .15s}
.chip-opt.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.create-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.create-btn:disabled{opacity:.5;cursor:not-allowed}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--text2)}
.mode-tab{flex:1;padding:9px;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;background:var(--bg);transition:all .15s}
.mode-tab.active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
.gen-step{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--border);font-size:13px;color:var(--text3);transition:all .4s}
.gen-step.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.gen-step.active{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.gen-step-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.generating-bar{background:var(--purple-bg);border:1px solid rgba(83,74,183,0.2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--purple);display:none;align-items:center;gap:8px}
.generating-bar.on{display:flex}
.gen-spinner{width:14px;height:14px;border:2px solid rgba(83,74,183,0.2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}

/* Onboarding */
.onboard-screen{position:fixed;inset:0;background:var(--bg3);z-index:60;display:none;flex-direction:column;overflow-y:auto}
.onboard-screen.on{display:flex}
.onboard-inner{padding:40px 24px 60px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:0}
.onboard-steps{display:flex;gap:6px;margin-bottom:32px}
.onboard-step{height:4px;border-radius:2px;flex:1;background:var(--bg2);transition:background .3s}
.onboard-step.on{background:var(--purple)}

.ob-chip.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.ob-textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;margin-bottom:20px;resize:none;min-height:80px;line-height:1.6}
.ob-textarea:focus{border-color:var(--purple)}
.ob-next{width:100%;padding:15px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.ob-skip{width:100%;padding:12px;background:transparent;color:var(--text3);border:none;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px}
.ob-saving{text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ob-saving-spinner{width:32px;height:32px;border:3px solid var(--purple-bg);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
.persona-btn{background:var(--purple-bg);border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--purple);cursor:pointer;font-family:inherit}

/* Loading */
.loading-screen{position:fixed;inset:0;background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px}
.loading-logo{width:56px;height:56px;background:var(--purple);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.loading-title{font-size:18px;font-weight:700}

@keyframes spin{to{transform:rotate(360deg)}}

.copy-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.copy-toast.show{opacity:1}

  } else {
    inner.innerHTML='<div class="onboard-steps">'+sh+'</div><div class="onboard-title">最後一步 ✨</div><div class="onboard-sub">告訴 AI 什麼話題絕對不能碰。</div><label class="ob-label">絕對不談的話題</label><textarea class="ob-textarea" id="ob-never" placeholder="例如：政治、宗教、競品比較">'+obData.never_cover+'</textarea><button class="ob-next" onclick="obFinish()">完成設定 🎉</button>';

// ===== 腳本解析 =====
var SEG_COLORS=['#534AB7','#D85A30','#0F6E56','#BA7517','#993556','#185FA5'];

function parseScript(rawText) {
  if (!rawText || rawText === 'AI 正在產出腳本，請稍候...') return null;

  function cleanMd(s) {
    return s.replace(/\*\*/g,'').replace(/\*/g,'').replace(/^#{1,6}\s*/gm,'').replace(/---+/g,'').trim();
  }
  function extractTime(s) {
    var m=s.match(/(\d+[\s]*[–\-~～到至][\s]*\d+[\s]*秒|最後[\s]*\d+[\s]*秒|前[\s]*\d+[\s]*秒|\d+[\s]*秒內)/);
    return m?m[0].trim():'';
  }
  function cleanTitle(s) {
    return s.replace(/\d+[\s]*[–\-~～到至][\s]*\d+[\s]*秒/g,'').replace(/最後[\s]*\d+[\s]*秒/g,'').replace(/前[\s]*\d+[\s]*秒/g,'').replace(/\d+[\s]*秒內/g,'').replace(/[（(][^）)]*[）)]/g,'').replace(/\|.*$/,'').replace(/^\s*[\-\|]\s*/,'').trim();
  }
  // 是否為製作備註段落
  function isProductionNote(title, body) {
    var t=title.toLowerCase();
    if(/製作|建議|📋|capcut|color|配色|配樂|後製|備注|備註|note/i.test(t)) return true;
    if((body.match(/\|/g)||[]).length>=4) return true; // Markdown 表格
    return false;
  }
  // 是否為純標題段落（過濾掉）
  function isTitleOnly(title, body) {
    var t=title.toLowerCase();
    if(/腳本$|完整.*腳本|秒腳本|^script$/i.test(t)&&body.trim().length<30) return true;
    if(body.trim().length<10) return true;
    return false;
  }
  // 解析子分鏡：偵測視覺說明裡的時間標記 bullet
  function parseSubShots(visualText) {
    // 偵測 "- **0-5秒**：" 或 "- 0-5秒：" 格式
    var subPattern=/[-\*]\s*(?:\*\*)?(\d+[\s]*[–\-~～到至][\s]*\d+[\s]*秒)(?:\*\*)?[：:]\s*([^\n]+(?:\n(?![-\*]\s*(?:\*\*)?\d).*)*)/g;
    var subs=[], m;
    while((m=subPattern.exec(visualText))!==null) {
      var lines=m[2].trim().split('\n').map(function(l){return l.replace(/^[-\s\*]+/,'').trim();}).filter(Boolean);
      subs.push({ time:m[1].trim(), lines:lines });
    }
    return subs.length>=2 ? subs : null; // 至少2個子分鏡才拆
  }
  // 解析視覺說明 bullets（一般格式）
  function parseVisualBullets(text) {
    var lines=text.split('\n');
    var bullets=[];
    lines.forEach(function(l){
      var clean=l.replace(/^[-\*\s]+/,'').replace(/\*\*/g,'').trim();
      if(clean) bullets.push(clean);
    });
    return bullets;
  }
  // 解析製作備註表格
  function parseProductionTable(body) {
    var rows=[];
    body.split('\n').forEach(function(line){
      if(/^\s*\|[-\s|]+\|\s*$/.test(line)) return; // 分隔行
      var cells=line.split('|').map(function(c){return c.replace(/\*\*/g,'').trim();}).filter(Boolean);
      if(cells.length>=2) rows.push({key:cells[0],val:cells[1]});
    });
    // 也抓非表格的 key: value 格式
    if(rows.length===0) {
      body.split('\n').forEach(function(line){
        var m=line.match(/^[-\*]?\s*\*?\*?([^：:]+)\*?\*?[：:]\s*(.+)/);
        if(m) rows.push({key:m[1].replace(/\*\*/g,'').trim(),val:m[2].trim()});
      });
    }
    return rows;
  }

  var isMarkdown=/^#{1,4}\s/m.test(rawText);
  var parts=isMarkdown?rawText.split(/(?=^#{1,4}\s)/m):rawText.split(/(?=【)/);

  var segments=[];
  var productionNotes=[];
  var colorIdx=0;

  parts.forEach(function(part){
    part=part.trim();
    if(!part) return;
    var header='',body='';
    if(isMarkdown){
      var lines=part.split('\n');
      header=cleanMd(lines[0]);
      body=lines.slice(1).join('\n').trim();
    } else {
      var hm=part.match(/【([^】]+)】/);
      if(!hm) return;
      header=hm[1];
      body=part.replace(/【[^】]+】/,'').trim();
    }
    if(!header) return;
    var cleanBody=cleanMd(body);
    if(isTitleOnly(header,cleanBody)) return;
    if(isProductionNote(header,cleanBody)) {
      productionNotes.push({title:cleanTitle(header)||header,rows:parseProductionTable(cleanBody),raw:cleanBody});
      return;
    }
    var timeRange=extractTime(header);
    var title=cleanTitle(header)||('段落'+(segments.length+1));
    var color=SEG_COLORS[colorIdx%SEG_COLORS.length];

    // 抓視覺說明
    var visualMatch=cleanBody.match(/(?:視覺|畫面|鏡頭)[：:]\s*([\s\S]*?)(?=\n\s*(?:文案|口播|台詞|配音|---)|$)/i);
    // 抓口播
    var scriptMatch=cleanBody.match(/(?:文案|口播|台詞|配音)[：:]\s*([\s\S]*?)(?=\n\s*(?:視覺|畫面|鏡頭|---)|$)/i);
    var visualRaw=visualMatch?visualMatch[1].trim():'';
    var scriptRaw=scriptMatch?scriptMatch[1].trim():'';
    if(!visualRaw&&!scriptRaw) scriptRaw=cleanBody;

    // 處理口播（取引號內或整段）
    var scriptText='';
    if(scriptRaw){
      var qm=scriptRaw.match(/[「『""]([\s\S]+?)[」』""]/g);
      if(qm) scriptText=qm.map(function(q){return q.replace(/^[「『""]|[」』""]$/g,'');}).join('\n\n');
      else scriptText=scriptRaw.replace(/^[-\*]\s*/gm,'').trim();
    }

    // 嘗試拆子分鏡
    var subShots=visualRaw?parseSubShots(visualRaw):null;
    if(subShots) {
      // 有子分鏡：每個子分鏡一張卡，口播放第一張
      subShots.forEach(function(sub,si){
        segments.push({
          index:segments.length+1,
          parentTitle:title,
          title:title,
          subTime:sub.time,
          timeRange:si===0?timeRange:'',
          visualLines:sub.lines,
          script:si===0?scriptText:'', // 口播只在第一張
          scriptNote:si===0&&subShots.length>1?'（整段口播）':'',
          color:color,
          isSub:true,
          isFirstSub:si===0,
          isLastSub:si===subShots.length-1,
        });
      });
    } else {
      // 沒有子分鏡：一張卡
      var bullets=visualRaw?parseVisualBullets(visualRaw):[];
      segments.push({
        index:segments.length+1,
        parentTitle:title,
        title:title,
        subTime:'',
        timeRange:timeRange,
        visualLines:bullets,
        script:scriptText,
        scriptNote:'',
        color:color,
        isSub:false,
        isFirstSub:true,
        isLastSub:true,
      });
    }
    colorIdx++;
  });

  return segments.length?{segments:segments,productionNotes:productionNotes}:null;
}

function copyText(text,msg){
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){showToast(msg);});}
  else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast(msg);}
}

var rawScriptMode=false;
var notesOpen=false;
function renderScriptNode(p,parsed) {
  var n=p.nodes.script;
  var content=n.content||'';
  var isGen=content==='AI 正在產出腳本，請稍候...';
  var html='';

  if(isGen){
    html='<div class="generating-box"><div class="generating-spinner"></div><div style="font-size:13px;font-weight:600;color:var(--purple)">AI 正在產出腳本中...</div><div style="font-size:11px;color:var(--text3);margin-top:6px">完成後會自動更新，不用等在這裡 🙌</div></div>';
  } else if(parsed&&!rawScriptMode){
    var segs=parsed.segments;
    var notes=parsed.productionNotes;

    // 工具列
    html+='<div class="script-toolbar">';
    html+='<button class="copy-all-btn" onclick="copyAllScript()">📋 複製完整腳本</button>';
    html+='<button class="raw-toggle" onclick="toggleRaw()">原始文字</button>';
    html+='</div>';

    // 時間軸
    html+='<div class="script-timeline">';
    var prevColor='';
    segs.forEach(function(seg,i){
      var isNewParent=(i===0)||segs[i-1].parentTitle!==seg.parentTitle;
      if(i>0) html+='<div class="tl-line" style="background:'+(isNewParent?'var(--border2)':seg.color+'60')+'"></div>';
      var label=seg.isSub&&!seg.isFirstSub?seg.subTime:seg.title;
      html+='<div class="tl-item"><div class="tl-node" onclick="scrollToCard('+i+')">';
      html+='<div class="tl-dot'+(seg.isSub&&!seg.isFirstSub?' '':'')+'" style="color:'+seg.color+';background:'+seg.color+'"></div>';
      html+='<div class="tl-label" style="color:'+seg.color+'">'+label+'</div>';
      if(seg.subTime&&seg.isFirstSub) html+='<div class="tl-time">'+seg.timeRange+'</div>';
      else if(seg.timeRange&&!seg.isSub) html+='<div class="tl-time">'+seg.timeRange+'</div>';
      else if(seg.subTime&&!seg.isFirstSub) html+='<div class="tl-time">'+seg.subTime+'</div>';
      html+='</div></div>';
    });
    html+='</div>';

    // 分鏡卡片
    segs.forEach(function(seg,i){
      var cardId='scard-'+i;
      var borderStyle=seg.isSub?'border-left:3px solid '+seg.color+';':'';
      html+='<div class="scard" id="'+cardId+'" style="'+borderStyle+'">';
      // Header
      html+='<div class="scard-header" style="background:'+seg.color+'12;">';
      if(!seg.isSub||seg.isFirstSub){
        html+='<div class="scard-num" style="background:'+seg.color+'">'+seg.index+'</div>';
        html+='<div class="scard-title" style="color:'+seg.color+'">'+seg.title+'</div>';
      } else {
        html+='<div style="width:24px;flex-shrink:0"></div>';
        html+='<div class="scard-title" style="color:'+seg.color+';font-size:12px;opacity:.8">'+seg.title+'</div>';
      }
      if(seg.subTime){
        html+='<div class="scard-time">'+seg.subTime+'</div>';
      } else if(seg.timeRange){
        html+='<div class="scard-time">'+seg.timeRange+'</div>';
      }
      html+='<button class="scard-opt" onclick="openOptSheet(segsRef['+i+'])" title="優化這段">✨</button>';
      html+='</div>';
      // Body
      html+='<div class="scard-body">';
      // 視覺說明
      if(seg.visualLines&&seg.visualLines.length){
        html+='<div class="scard-section">';
        html+='<div class="scard-section-label">🎥 畫面說明</div>';
        seg.visualLines.forEach(function(line){
          html+='<div class="scard-visual-item"><div class="scard-visual-dot"></div><div class="scard-visual-text">'+line+'</div></div>';
        });
        html+='</div>';
      }
      // 口播腳本
      if(seg.script){
        if(seg.visualLines&&seg.visualLines.length) html+='<div class="scard-divider"></div>';
        html+='<div class="scard-section">';
        html+='<div class="scard-section-label">🎙 口播腳本'+(seg.scriptNote?' <span style="color:var(--text3);font-weight:400">'+seg.scriptNote+'</span>':'')+'</div>';
        html+='<div class="scard-script">'+seg.script.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')+'</div>';
        html+='</div>';
      }
      html+='</div></div>';
    });

    // 製作備註折疊
    if(notes&&notes.length){
      html+='<div class="production-notes" id="prod-notes">';
      html+='<div class="production-notes-header" onclick="toggleNotes()">';
      html+='<span style="font-size:16px">💡</span>';
      html+='<div class="production-notes-title">製作備註</div>';
      html+='<div class="production-notes-chevron'+(notesOpen?' open':'')+'">›</div>';
      html+='</div>';
      html+='<div class="production-notes-body'+(notesOpen?' open':'')+'">';
      notes.forEach(function(note){
        if(note.rows&&note.rows.length){
          note.rows.forEach(function(row){
            html+='<div class="note-row"><div class="note-key">'+row.key+'</div><div class="note-val">'+row.val+'</div></div>';
          });
        } else {
          html+='<div style="font-size:12px;color:var(--text2);line-height:1.7">'+note.raw+'</div>';
        }
      });
      html+='</div></div>';
    }
  } else {
    // 原始文字或解析失敗
    html+='<div class="script-toolbar">';
    html+='<button class="copy-all-btn" onclick="copyAllScript()">📋 複製完整腳本</button>';
    if(parsed) html+='<button class="raw-toggle on" onclick="toggleRaw()">分鏡卡片</button>';
    html+='</div>';
    html+='<div class="content-box">'+content+'</div>';
  }

  // 三選一 CTA（腳本產出後顯示）
  if(!isGen && content && content !== 'AI 正在產出腳本，請稍候...') {
    html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:16px;margin-bottom:4px">';
    html += '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px">腳本看完了，接下來？</div>';
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    html += '<button onclick="confirmScript(\''+p.id+'\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--green);background:var(--green-bg);color:var(--green);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;text-align:left"><span style="font-size:20px">✅</span><div><div>滿意，開始準備拍攝</div><div style="font-size:11px;font-weight:400;opacity:.8">進入拍攝節點，照著分鏡逐一拍攝</div></div></button>';
    html += '<button onclick="switchPhase(\'script\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--purple);background:var(--purple-bg);color:var(--purple);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;text-align:left"><span style="font-size:20px">✏️</span><div><div>某段不太對，想調整</div><div style="font-size:11px;font-weight:400;opacity:.8">點分鏡卡片上的 ✨ 選優化方向</div></div></button>';
    html += '<button onclick="rewriteScript(\''+p.id+'\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;text-align:left"><span style="font-size:20px">🔄</span><div><div>整份方向不對，重新來過</div><div style="font-size:11px;font-weight:400;opacity:.8">說明哪裡不對，AI 重新產出</div></div></button>';
    html += '</div></div>';
  }

  // 留言
  var cmts=n.comments&&n.comments.length?n.comments.map(function(c){return '<div class="comment '+(c.ai?'ai-c':'user-c')+'"><div class="c-author">'+c.author+'</div><div class="c-text">'+c.text+'</div><div class="c-time">'+c.time+'</div></div>';}).join(''):'<div style="font-size:11px;color:var(--text3);padding:4px 0 8px">尚無留言</div>';
  html+='<div class="ns-label" style="margin-top:16px">留言與修改建議</div><div class="comments">'+cmts+'</div>';
  html+='<div class="comment-row"><input id="ci-script" placeholder="輸入修改建議..." /><button class="send-btn" onclick="sendComment(\''+p.id+'\',\'script\')">送出</button></div>';
  return html;
}

function renderPhaseContent(p, phaseKey) {
  var ph=PHASES.filter(function(x){return x.key===phaseKey;})[0];
  var n=p.nodes[phaseKey];
  var html='<div class="step-hint">'+ph.hint+'</div>';

  if(phaseKey==='script'){
    var parsed=parseScript(n.content||'');
    segsRef=parsed?parsed.segments:[];
    html+=renderScriptNode(p,parsed);

  }
  if(phaseKey==='shoot'){
    if(!n.scenes||!n.scenes.length){
      html+='<div style="text-align:center;padding:32px;color:var(--text3)"><div style="font-size:32px;margin-bottom:10px">🎬</div><div style="font-size:13px">腳本確認後將自動生成分鏡卡片</div></div>';

    html+='<div class="checklist">';
    n.checks.forEach(function(c,ci){
      html+='<div class="check-item'+(c.done?' checked':'')+'" onclick="toggleCheck(\''+p.id+'\',\''+phaseKey+'\','+ci+')"><div class="check-box'+(c.done?' on':'')+'>'+(c.done?'✓':'')+'</div><span class="ci-text">'+c.text+'</span></div>';
    });
    html+='</div>';
  }
  if(phaseKey==='cover'||phaseKey==='edit'){
    html+='<div class="upload-area"><div class="upload-icon">📁</div><div class="upload-label">點此上傳檔案</div></div>';
  }
  if(n.content&&n.content!=='待後製完成後產出'&&n.content!=='待封面確認後產出'&&n.content!=='封面確認後，自動產出五平台發布文案'){
    html+='<div class="ns-label">產出內容</div><div class="content-box">'+n.content+'</div>';
  }
  html+=renderComments(p,phaseKey);
  return html;
}

function renderComments(p,phKey){
  var n=p.nodes[phKey];
  var cmts=n.comments&&n.comments.length?n.comments.map(function(c){return '<div class="comment '+(c.ai?'ai-c':'user-c')+'"><div class="c-author">'+c.author+'</div><div class="c-text">'+c.text+'</div><div class="c-time">'+c.time+'</div></div>';}).join(''):'<div style="font-size:11px;color:var(--text3);padding:4px 0 8px">尚無留言</div>';
  return '<div class="ns-label" style="margin-top:16px">留言</div><div class="comments">'+cmts+'</div><div class="comment-row"><input id="ci-'+phKey+'" placeholder="輸入備註或修改建議..." /><button class="send-btn" onclick="sendComment(\''+p.id+'\',\''+phKey+'\')">送出</button></div>';
}

// ===== Panel 控制 =====
var projects=[], openProject=null, currentPhase='script', pollTimer=null;
var newBadgeIds={}, pendingDeleteId=null, undoDeleteId=null, undoDeleteTimer=null, undoDeleteProj=null;

function openPanel(id){
  openProject=id; currentPhase='script'; rawScriptMode=false; notesOpen=false;
  if(newBadgeIds[id]){delete newBadgeIds[id];renderList();}
  var p=projects.filter(function(x){return x.id===id;})[0];
  document.getElementById('p-title').textContent=p.title;
  renderStepNav(p);
  renderPanelContent(p);
  document.getElementById('panel').classList.add('on');
  document.getElementById('overlay').classList.add('on');
}

function renderStepNav(p){
  var nav=document.getElementById('step-nav-inner');
  var html='<button class="step-btn overview'+(currentPhase==='overview'?' active':'')+'" onclick="switchPhase(\'overview\',event)">📋 全覽</button>';
  PHASES.forEach(function(ph){
    var n=p.nodes[ph.key];
    var isDone=n&&n.status==='done';
    var isActive=currentPhase===ph.key;
    var cls=isActive?'active':isDone?'done':'';
    html+='<button class="step-btn '+cls+'" onclick="switchPhase(\''+ph.key+'\',event)">'+ph.icon+' '+ph.label+'</button>';
  });
  nav.innerHTML=html;
}

function switchPhase(key,e){
  currentPhase=key; rawScriptMode=false; notesOpen=false;
  var p=projects.filter(function(x){return x.id===openProject;})[0];
  if(!p) return;
  renderStepNav(p);
  renderPanelContent(p);
}

function renderPanelContent(p){
  var content=document.getElementById('panel-content');
  if(currentPhase==='overview'){
    var html='';
    PHASES.forEach(function(ph,i){
      var n=p.nodes[ph.key];
      var badge=n.status==='done'?'nb-done已完成':n.status==='active'?'nb-active進行中':n.status==='review'?'nb-review待審核':'nb-wait待開始';
      var bc=badge.split('nb-')[1].split(/[A-Z]/)[0];
      html+='<div class="overview-phase"><div class="overview-phase-header" onclick="toggleOverviewPhase('+i+')">';
      html+='<div class="overview-phase-dot" style="background:'+ph.color+'"></div>';
      html+='<div class="overview-phase-name">'+ph.icon+' '+ph.label+'</div>';
      html+='<span class="overview-phase-badge nb-'+bc+'">'+badge.replace('nb-'+bc,'').trim()+'</span>';
      html+='<div class="overview-chevron'+(i===0?' open':'')+'" id="ov-ch-'+i+'">›</div>';
      html+='</div>';
      html+='<div class="overview-body'+(i===0?' open':'')+'" id="ov-body-'+i+'">'+renderPhaseContent(p,ph.key)+'</div></div>';
    });
    content.innerHTML=html;
  } else {
    content.innerHTML=renderPhaseContent(p,currentPhase);
  }
}

function toggleOverviewPhase(i){
  var body=document.getElementById('ov-body-'+i);
  var ch=document.getElementById('ov-ch-'+i);
  if(body){body.classList.toggle('open');ch.classList.toggle('open');}
}

function closePanel(){
  document.getElementById('panel').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
  openProject=null; rawScriptMode=false; notesOpen=false;
}

// ===== 專案列表 =====
function getNodeDots(proj){
  var order=['script','shoot','edit','cover','copy','publish'];
  var colors=['#534AB7','#D85A30','#0F6E56','#BA7517','#993556','#185FA5'];
  return order.map(function(key,i){var n=proj.nodes[key];if(!n)return '#E0E0E0';if(n.status==='done')return '#0F6E56';if(n.status==='active'||n.status==='review')return colors[i];return '#E0E0E0';});
}
function getDoneCount(proj){return['script','shoot','edit','cover','copy','publish'].filter(function(k){return proj.nodes[k]&&proj.nodes[k].status==='done';}).length;}

function renderFilters(){
  var stages=['all','script','shoot','edit','review','schedule','done'];
  var labels={all:'全部',script:'腳本',shoot:'拍攝',edit:'後製',review:'待審核',schedule:'排程',done:'已發布'};
  document.getElementById('filters').innerHTML=stages.map(function(s){
    var cnt=s==='all'?projects.length:projects.filter(function(p){return p.col===s;}).length;
    if(cnt===0&&s!=='all') return '';
    return '<button class="filter-btn'+(currentFilter===s?' active':'')+'" onclick="setFilter(\''+s+'\')">'
      +labels[s]+'<span class="filter-count">'+cnt+'</span></button>';
  }).join('');
}
var currentFilter='all';
function setFilter(f){currentFilter=f;renderFilters();renderList();}

function renderList(){
  var list=document.getElementById('project-list');
  var filtered=currentFilter==='all'?projects:projects.filter(function(p){return p.col===currentFilter;});
  if(!filtered.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">'+(currentFilter==='all'?'還沒有影片專案':'此分類沒有影片')+'</div><div class="empty-sub">'+(currentFilter==='all'?'點右下角 ＋ 新增第一支影片！':'換個分類看看')+'</div></div>';
    updateStats(); return;
  }
  list.innerHTML=filtered.map(function(p){
    var dots=getNodeDots(p),done=getDoneCount(p);
    var sc=STAGE_COLORS[p.col]||STAGE_COLORS['script'];
    var tagsHtml=(p.tags||[]).map(function(t){var tg=TAGS[t]||{label:t,bg:'#F1EFE8',color:'#444441'};return '<span class="pc-tag" style="background:'+tg.bg+';color:'+tg.color+'">'+tg.label+'</span>';}).join('');
    var dotsHtml=dots.map(function(d){return '<div class="pb-seg" style="background:'+d+'"></div>';}).join('');
    var badge=newBadgeIds[p.id]?'<span style="background:#E53E3E;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:6px">NEW</span>':'';
    return '<div class="project-card'+(p.urgent?' urgent':'')+'">'
      +'<div class="pc-top"><div class="pc-title" onclick="openPanel(\''+p.id+'\')">'+(p.urgent?'⚠️ ':'')+p.title+badge+'</div>'
      +'<div class="pc-actions"><button class="pc-delete" onclick="askDelete(\''+p.id+'\',\''+p.title.replace(/'/g,"\\'")+'\')">🗑</button><div class="pc-arrow" onclick="openPanel(\''+p.id+'\')">›</div></div></div>'
      +'<div class="pc-meta" onclick="openPanel(\''+p.id+'\')"><span class="pc-stage" style="background:'+sc.bg+';color:'+sc.color+'">'+sc.label+'</span>'+tagsHtml+'</div>'
      +'<div class="pc-bar" onclick="openPanel(\''+p.id+'\')">'+dotsHtml+'<span class="pc-count">'+done+'/6</span></div></div>';
  }).join('');
  updateStats();
}
function updateStats(){
  document.getElementById('s-total').textContent=projects.length;
  document.getElementById('s-active').textContent=projects.filter(function(p){return p.col!=='pending'&&p.col!=='done';}).length;
  document.getElementById('s-review').textContent=projects.filter(function(p){return p.col==='review';}).length;
  document.getElementById('s-done').textContent=projects.filter(function(p){return p.col==='done';}).length;
}

// ===== 刪除（5秒復原）=====
function askDelete(id,title){pendingDeleteId=id;document.getElementById('confirm-sub').textContent='「'+title+'」刪除後無法復原。';document.getElementById('confirm-modal').classList.add('on');}
function closeConfirm(){pendingDeleteId=null;document.getElementById('confirm-modal').classList.remove('on');}
async function confirmDelete(){
  if(!pendingDeleteId) return;
  var id=pendingDeleteId,proj=projects.filter(function(x){return x.id===id;})[0];
  closeConfirm();
  projects=projects.filter(function(x){return x.id!==id;});
  renderFilters();renderList();
  undoDeleteId=id;undoDeleteProj=proj;
  if(undoDeleteTimer) clearTimeout(undoDeleteTimer);
  showToastUndo('🗑 已刪除',function(){
    if(undoDeleteId===id){clearTimeout(undoDeleteTimer);undoDeleteId=null;projects.unshift(undoDeleteProj);projects.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});renderFilters();renderList();showToast('↩️ 已復原');}
  });
  undoDeleteTimer=setTimeout(async function(){if(undoDeleteId===id){await dbDelete(id);undoDeleteId=null;undoDeleteProj=null;}},5000);
}
function showToastUndo(msg,onUndo){
  var t=document.getElementById('copy-toast');
  t.innerHTML=msg+' <span id="undo-btn" style="color:#A8CFFF;font-weight:700;cursor:pointer;margin-left:8px;text-decoration:underline">復原</span>';
  t.classList.add('show');
  var btn=document.getElementById('undo-btn');
  if(btn) btn.onclick=function(e){e.stopPropagation();t.classList.remove('show');onUndo();};
  setTimeout(function(){t.classList.remove('show');},5000);
}
function showToast(msg){
  var t=document.getElementById('copy-toast');
  t.innerHTML=msg||'✅ 已複製！';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// ===== Polling =====
function startPolling(projId){
  var attempts=0;
  pollTimer=setInterval(async function(){
    attempts++;
    if(attempts>24){clearInterval(pollTimer);return;}
    var r=await sbFetch('/projects?id=eq.'+projId);
    if(!r.ok) return;
    var d=await r.json();
    if(!d.length) return;
    var updated=d[0];
    if(updated.nodes&&updated.nodes.script&&updated.nodes.script.content&&updated.nodes.script.content!=='AI 正在產出腳本，請稍候...'){
      clearInterval(pollTimer);
      var idx=projects.findIndex(function(p){return p.id===projId;});
      if(idx>-1) projects[idx]=updated;
      newBadgeIds[projId]=true;
      renderFilters();renderList();
      if(openProject===projId) renderPanelContent(updated);
      document.title='✅ 腳本完成 — ShortsBoard';
      setTimeout(function(){document.title='ShortsBoard';},8000);
      showToast('✅ 腳本產出完成！');
    }
  },5000);
}

// ===== 互動 =====
async function toggleCheck(pid,phKey,ci){
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].checks[ci].done=!p.nodes[phKey].checks[ci].done;
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelContent(p);renderList();
}
async function toggleScene(pid,si){
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes.shoot.scenes[si].done=!p.nodes.shoot.scenes[si].done;
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelContent(p);renderList();
}
async function sendComment(pid,phKey){
  var inputId=phKey==='script'?'ci-script':'ci-'+phKey;
  var input=document.getElementById(inputId);
  var text=input?input.value.trim():'';
  if(!text) return;
  var p=projects.filter(function(x){return x.id===pid;})[0];
  p.nodes[phKey].comments.push({author:'你',text:text,time:'剛剛',ai:false});
  input.value='';
  await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
  renderPanelContent(p);
  setTimeout(async function(){
    p.nodes[phKey].comments.push({author:'Claude AI',text:'收到你的修改建議！請稍後查看更新內容。',time:'剛剛',ai:true});
    await dbUpdate(pid,{nodes:p.nodes,updated_at:new Date().toISOString()});
    renderPanelContent(p);
  },800);
}

// ===== 快速/進階模式 =====
var currentMode = 'quick';
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('mode-quick').classList.toggle('active', mode==='quick');
  document.getElementById('mode-adv').classList.toggle('active', mode==='adv');
  document.getElementById('adv-fields').style.display = mode==='adv' ? 'block' : 'none';
}

// ===== 等待進度動畫 =====
var genStepTimer = null;
function startGenProgress() {
  document.getElementById('form-screen').style.display = 'none';
  document.getElementById('gen-screen').style.display = 'block';
  var steps = ['gstep-0','gstep-1','gstep-2','gstep-3'];
  var delays = [0, 4000, 10000, 22000];
  steps.forEach(function(id) {
    document.getElementById(id).className = 'gen-step';
    document.getElementById(id).querySelector('.gen-step-icon').textContent = '⏳';
  });
  delays.forEach(function(delay, i) {
    setTimeout(function() {
      // 完成前一個
      if (i > 0) {
        var prev = document.getElementById(steps[i-1]);
        prev.className = 'gen-step done';
        prev.querySelector('.gen-step-icon').textContent = '✅';
      }
      // 啟動當前
      var cur = document.getElementById(steps[i]);
      if (cur) {
        cur.className = 'gen-step active';
        cur.querySelector('.gen-step-icon').textContent = '⚡';
      }
    }, delay);
  });
}
function stopGenProgress() {
  document.getElementById('gen-screen').style.display = 'none';
  document.getElementById('form-screen').style.display = 'block';
}

// ===== 三選一動作 =====
async function confirmScript(pid) {
  var p = projects.filter(function(x){return x.id===pid;})[0];
  if (!p) return;
  p.nodes.script.status = 'done';
  p.col = 'shoot';
  await dbUpdate(pid, {nodes:p.nodes, col:'shoot', updated_at:new Date().toISOString()});
  currentPhase = 'shoot';
  renderStepNav(p); renderPanelContent(p); renderList();
  showToast('🎬 開始拍攝！');
}

var rewriteTarget = null;
function rewriteScript(pid) {
  rewriteTarget = pid;
  var p = projects.filter(function(x){return x.id===pid;})[0];
  if (!p) return;
  // 回到表單，填入原有主題
  closePanel();
  document.getElementById('new-title').value = p.title;
  switchMode('adv');
  document.getElementById('modal').classList.add('on');
  showToast('說明哪裡不對，重新送出就會重新產腳本');
}

// ===== 新增專案 =====
function makeDefaultNodes(){
  return {
    script:{status:'wait',content:'AI 正在產出腳本，請稍候...',comments:[]},
    shoot:{status:'wait',scenes:[],comments:[]},
    edit:{status:'wait',checks:[
      {done:false,text:'匯入素材依序排列'},{done:false,text:'AI 智能剪接'},
      {done:false,text:'審視節奏並微調'},{done:false,text:'AI 自動字幕'},
      {done:false,text:'BGM 配樂'},{done:false,text:'套用轉場模板'},
      {done:false,text:'第一幀疊加大字 Hook'},{done:false,text:'完整審視確認'},
      {done:false,text:'匯出 1080p MP4'}
    ],comments:[]},
    cover:{status:'wait',content:'後製完成後，提供標題即可產出封面圖卡',comments:[]},
    copy:{status:'wait',content:'封面確認後，自動產出五平台發布文案',comments:[]},
    publish:{status:'wait',checks:[
      {done:false,text:'確認發布時間'},{done:false,text:'Meta Business Suite 排程 FB+IG'},
      {done:false,text:'YouTube Studio 排程上傳'},{done:false,text:'Threads 排程發布'},
      {done:false,text:'四平台排程全部確認完成'}
    ],comments:[]}
  };
}
function selectChip(gid,btn){document.getElementById(gid).querySelectorAll('.chip-opt').forEach(function(c){c.classList.remove('on');});btn.classList.add('on');}
function getSelectedChip(gid){var g=document.getElementById(gid);if(!g)return '';var s=g.querySelector('.chip-opt.on');return s?s.textContent:'';}

async function createProject(){
  var titleEl = document.getElementById('new-title');
  var title = titleEl.value.trim();
  if(!title){alert('請描述影片想講什麼');return;}
  var uid=getUserId();if(!uid){alert('請先完成人設設定');return;}

  var points = currentMode==='adv' ? (document.getElementById('new-points')||{}).value||'' : '';
  var length = currentMode==='adv' ? getSelectedChip('length-chips') : '30–60 秒';
  var material = currentMode==='adv' ? getSelectedChip('material-chips') : '還沒拍，需要完整腳本';
  var style = currentMode==='adv' ? getSelectedChip('style-chips') : '教學乾貨';

  document.getElementById('create-btn').disabled=true;
  startGenProgress();

  var projId='p'+Date.now();
  var tempProj={id:projId,user_id:uid,col:'script',title:title,tags:[],urgent:false,nodes:makeDefaultNodes()};
  var saved=null;
  if(!uid.startsWith('anon_')) saved=await dbInsert(tempProj);
  if(saved||uid.startsWith('anon_')){projects.unshift(saved||tempProj);renderFilters();renderList();}

  try{
    await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:uid,project_id:projId,title:title,
        points:points.replace(/\n/g,' ').replace(/\r/g,' ')||'（請依據主題自動補充3個重點）',
        length:length,material:material,style:style})});
  }catch(e){console.error('Webhook error',e);}

  // 關閉 modal，顯示等待感
  setTimeout(function(){
    closeModal();
    if(!uid.startsWith('anon_')) startPolling(projId);
  }, 1500);
}

function openModal(){
  document.getElementById('new-title').value='';
  if(document.getElementById('new-points')) document.getElementById('new-points').value='';
  document.getElementById('create-btn').disabled=false;
  stopGenProgress();
  switchMode('quick');
  document.getElementById('modal').classList.add('on');
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  stopGenProgress();
  document.getElementById('create-btn').disabled=false;
}

// ===== 初始化 =====
async function init(){
  var uid=getUserId();
  if(!uid){document.getElementById('loading').style.display='none';showOnboarding(false);return;}
  if(!uid.startsWith('anon_')){var user=await loadUser(uid);if(user){currentUser=user;updateHeaderUser();}}
  else{currentUser={id:uid,name:'創作者'};updateHeaderUser();}
  projects=await dbGetAll();
  document.getElementById('loading').style.display='none';
  renderFilters();renderList();
}
init();
